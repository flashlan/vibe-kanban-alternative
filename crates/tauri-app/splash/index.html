<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vibe Kanban</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #121212;
    color: #888;
  }
  .vk-splash-icon {
    width: 96px;
    height: 96px;
    border-radius: 22px;
    display: block;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    animation: vk-pulse 1.6s ease-in-out infinite;
  }
  .spinner {
    width: 22px;
    height: 22px;
    border: 2px solid rgba(255,255,255,0.18);
    border-top-color: rgba(255,255,255,0.7);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes vk-pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.92; transform: scale(1.03); }
  }
</style>
</head>
<body>
<!-- Startup banner — dark background with centered app icon, mirrors local-web index.html banner -->
<svg class="vk-splash-icon" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Vibe Kanban" role="img">
  <rect width="96" height="96" rx="22" fill="#1a1a1a"/>
  <rect width="96" height="96" rx="22" fill="black" fill-opacity="0.35"/>
  <defs>
    <linearGradient id="vk-g" x1="14" y1="18" x2="82" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d946ef"/>
      <stop offset="28%" stop-color="#7c3aed"/>
      <stop offset="52%" stop-color="#0ea5e9"/>
      <stop offset="76%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>
  <!-- Stylized K — thick geometric shape approximating the app icon -->
  <path d="M18 20 L32 20 L48 48 L64 20 L78 20 L52 58 L78 76 L64 76 L48 54 L32 76 L18 76 L38 48 Z" fill="url(#vk-g)"/>
  <!-- Three stacked cards on the right (subtle, as in the app icon) -->
  <rect x="62" y="28" width="18" height="11" rx="3" fill="#7c3aed" opacity="0.95"/>
  <rect x="62" y="43" width="18" height="11" rx="3" fill="#fb7185" opacity="0.95"/>
  <rect x="62" y="58" width="18" height="11" rx="3" fill="#f59e0b" opacity="0.95"/>
  <rect x="65" y="32" width="10" height="2" rx="1" fill="black" opacity="0.35"/>
  <rect x="65" y="47" width="10" height="2" rx="1" fill="black" opacity="0.35"/>
  <rect x="65" y="62" width="10" height="2" rx="1" fill="black" opacity="0.35"/>
  <circle cx="77" cy="33.5" r="1.8" fill="black" opacity="0.5"/>
  <circle cx="77" cy="48.5" r="1.8" fill="black" opacity="0.5"/>
  <circle cx="77" cy="63.5" r="1.8" fill="black" opacity="0.5"/>
</svg>
<div class="spinner" aria-hidden="true"></div>
</body>
</html>
