name = "Async OpenCode GLM"
description = "Self-drive Async flow for an OpenCode (GLM-5.2) execution agent: the main loop writes the spec, plan, and code itself — an OpenCode session cannot spawn the plugin's Claude subagents — and Codex reviews the plan (gated) and, optionally, the diff. Run this pipeline with an OpenCode execution agent on its GLM-5.2 profile. OpenCode pipelines use MiniMax / GLM / Kimi models only; never mix in Claude models (Codex is the shared reviewer for both families)."

[[stage]]
id = "orchestrate"
label = "Orchestrate (auto-drive)"
default_enabled = false
prompt = "Have the orchestrator agent pick this card up and drive it to done autonomously, running the card's pipeline stages in order — regardless of which board column the card is in (it may be started even from Todo)."

[[stage]]
id = "memory"
label = "Project memory (mem0)"
default_enabled = true
prompt = "PROJECT MEMORY: this pipeline includes the mem0 project-memory stage. SCOPING: call `get_context` first — `workspace_repos` lists every repo attached to this workspace (usually one). Use `workspace_repos[0].repo_name` as the PRIMARY `user_id` for `memory_search`/`memory_save` calls — that's this workspace's main project repo. If `workspace_repos` has more than one entry and the fact or query you're handling genuinely concerns a different repo in that list (e.g. a card doing cross-repo integration work), ALSO call `memory_search`/`memory_save` with that OTHER repo's `repo_name` as `user_id` — memory stays scoped per-repo, but a secondary repo you're actively integrating with isn't left blind. Never use a repo slug outside `workspace_repos`. (1) BEFORE you begin, recall memories relevant to the code you will touch: call `memory_search` with `user_id` set to the relevant repo slug(s) and a query naming the files/modules/area this card changes. Returns at most 5 hits per call — if they don't cover what you need, refine the query (narrower terms, a different file/module) and call it again rather than assuming one call is enough. Apply only memories that genuinely match this work; ignore irrelevant ones. If a hit names a specific module, file, or entity and you need to know how it fits into the surrounding code — what depends on it, what it depends on — rather than just that one isolated fact, call `memory_graph_traverse` from that entity name; it returns real graph structure, not just similar-sounding text. If a hit looks old, or inconsistent with the code you are actually seeing, call `memory_check_staleness` with that entity name before trusting or acting on it — a stale memory (describing code already removed or changed) is worse than no memory at all. Never let a memory override the card's explicit instructions. (2) WHILE you work, note any new DURABLE fact about the project (a decision, convention, dependency, or root cause) that a future session would need — and which repo it belongs to. (3) AFTER the work is verified, call `memory_save` with `user_id` set to that fact's repo slug for each such fact. The content MUST be self-contained, factual, and verified — NEVER save speculation, guesses, half-finished work, or ephemeral state (commit hashes, timestamps, log lines). A false or unverified memory poisons every future agent, so when in doubt, do not save."

[[stage]]
id = "spec"
label = "Spec (self)"
default_enabled = true
prompt = "FIRST, check the card description: if it already contains the full spec — meaning `### Outcome`, `### Scope`, and `### Testing & acceptance criteria` EACH occur at the START of a line (prefix match), and NOT inside a fenced code block or a block quote; ALL THREE are required and if any one is missing take the OTHERWISE path — then write `SPEC.md` at the workspace root as exactly: the line `## Task: <the card's title, verbatim>`, then a blank line, then the card description verbatim, stripping the `## Pipeline` block anchored to STANDALONE `<!-- vk:pipeline:start -->` / `<!-- vk:pipeline:end -->` marker lines (delete everything between them including both markers; a marker mentioned inside a prose line is not a delimiter), collapsing the blank run the strip leaves, and sweeping out any stray executor-pin bullet left outside the block. Do not edit, re-author, or re-verify the copied text: adopt the card's decisions as settled, report \"spec adopted from card description\", and move on. OTHERWISE, write the technical spec YOURSELF to `SPEC.md` at the workspace root — ground it in the card description plus quick repo lookups; cover the outcome, scope, technical requirements, and testing & acceptance criteria; keep any decisions the card already made settled rather than re-opening them."

[[stage]]
id = "plan"
label = "Plan (self)"
default_enabled = true
prompt = "Turn `SPEC.md` into a step-by-step `IMPLEMENTATION_PLAN.md` at the workspace root YOURSELF, grounded in real repo files — Goal, Approach, ordered Steps each naming the real `files:` it touches with an observable `done-when:` check, Verification, and Risks / open questions. When the plan is verified, measure it and report the single line `PLAN-FACTS: <size> KB, <n> steps, <n> files, <n> open decisions` — the next two stages read this line."

[[stage]]
id = "plan-review-codex"
label = "Codex plan review"
default_enabled = true
prompt = "GATE FIRST — read the plan stage's PLAN-FACTS line (measure `IMPLEMENTATION_PLAN.md` yourself if it is missing): if the plan is under 40 KB AND has 0 open decisions AND the card's **Routing:** line (when it carries one) does not force the review with plan-review: yes, SKIP this stage — report the single line `PLAN-GATE: plan-review skipped (<size> KB, <n> open decisions)` and move on. Otherwise report `PLAN-GATE: plan-review running (<size> KB, <n> open decisions)` and have Codex independently review `IMPLEMENTATION_PLAN.md` (`codex exec --sandbox read-only` over the plan — do NOT review it yourself). Iterate until Codex reports no significant findings, capped at TWO review passes — findings still open after the second pass mean the plan (or the spec above it) is mis-scoped: revise the plan (re-run the planning stage) or escalate; never pay a third pass. Resolve confirmed findings by revising the plan before any code is written. This is a read-only plan review: do not modify code here."

[[stage]]
id = "implement"
label = "Implement (self)"
default_enabled = true
prompt = "Implement the card YOURSELF, strictly from `SPEC.md` and `IMPLEMENTATION_PLAN.md`, step by step — run each step's `done-when:` check, commit as you go, and run the project's own checks before advancing. You are the coder on this pipeline: a single-model OpenCode session, so there is no coder subagent to spawn and no cross-family model to borrow. If the work outgrows the card's Routing tier (an unpriced design decision, scope far beyond the plan), commit safe work and escalate with the `VK-ESCALATE: <tier>-><proposed-tier> — <evidence>` first line instead of grinding through."

[[stage]]
id = "code-review"
label = "Review via Codex"
default_enabled = false
prompt = "After implementing, run an independent Codex review of the card's diff (the `codex-review` skill / Codex CLI), iterating until it reports no significant findings, capped at TWO passes — findings still open after the second pass are a scope problem, not a review problem: fix what is confirmed, report what remains, and move on. Address confirmed findings and re-verify before marking the card ready."

[[stage]]
id = "review-manual"
label = "Manual review (alarm)"
default_enabled = false
prompt = "MANUAL REVIEW: stop here and hand the work to the operator. Commit all work-in-progress first (staged, with a descriptive message) so nothing is lost, leave the tree otherwise clean, then emit a line exactly like `VK-REVIEW-REQUEST: <one-line summary of what to review and where>` and STOP — this triggers an alarm so the operator reviews the result. Do NOT advance to any later stage, do NOT merge, and do NOT open a PR until the operator responds with explicit instructions."
[[stage]]
id = "merge"
label = "Merge to base"
default_enabled = true
prompt = "When the work is implemented and reviewed, squash-merge this card's branch into the base branch yourself — this stage being listed is your authorization, so do not wait for a go-ahead; gating, when wanted, is the Wait-for-approval stage's job."

[[stage]]
id = "pr"
label = "Open pull request"
default_enabled = false
prompt = "When the work is implemented and reviewed, open a pull request for this card against the base branch."
