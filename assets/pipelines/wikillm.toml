name = "WikiLLM"
description = "Knowledge-augmented dev flow: recall prior knowledge before planning and enrich the knowledge base after shipping."

[[stage]]
id = "orchestrate"
label = "Orchestrate (auto-drive)"
default_enabled = false
prompt = "Have the orchestrator agent pick this card up and drive it to done autonomously, running the card's pipeline stages in order — regardless of which board column the card is in (it may be started even from Todo)."

[[stage]]
id = "memory"
label = "Project memory (mem0)"
default_enabled = true
prompt = "PROJECT MEMORY: this pipeline includes the mem0 project-memory stage. SCOPING: call `get_context` first — `workspace_repos` lists every repo attached to this workspace (usually one). Use `workspace_repos[0].repo_name` as the PRIMARY `user_id` for `memory_search`/`memory_save` calls — that's this workspace's main project repo. If `workspace_repos` has more than one entry and the fact or query you're handling genuinely concerns a different repo in that list (e.g. a card doing cross-repo integration work), ALSO call `memory_search`/`memory_save` with that OTHER repo's `repo_name` as `user_id` — memory stays scoped per-repo, but a secondary repo you're actively integrating with isn't left blind. Never use a repo slug outside `workspace_repos`. (1) BEFORE you begin, recall memories relevant to the code you will touch: call `memory_search` with `user_id` set to the relevant repo slug(s) and a query naming the files/modules/area this card changes. Returns at most 5 hits per call — if they don't cover what you need, refine the query (narrower terms, a different file/module) and call it again rather than assuming one call is enough. Apply only memories that genuinely match this work; ignore irrelevant or stale ones — never let a memory override the card's explicit instructions. (2) WHILE you work, note any new DURABLE fact about the project (a decision, convention, dependency, or root cause) that a future session would need — and which repo it belongs to. (3) AFTER the work is verified, call `memory_save` with `user_id` set to that fact's repo slug for each such fact. The content MUST be self-contained, factual, and verified — NEVER save speculation, guesses, half-finished work, or ephemeral state (commit hashes, timestamps, log lines). A false or unverified memory poisons every future agent, so when in doubt, do not save."

[[stage]]
id = "spec"
label = "Create spec"
default_enabled = true
prompt = "FIRST, check the card description: if it already contains the full spec — meaning `### Outcome`, `### Scope`, and `### Testing & acceptance criteria` EACH occur at the START of a line (prefix match, so `### Outcome — what's different when this is done` counts), and NOT inside a fenced code block or a block quote; ALL THREE are required and if any one is missing take the OTHERWISE path — then copy it through instead of writing one from scratch: write `SPEC.md` at the workspace root as exactly the line `## Task: <the card's title, verbatim>`, then a blank line, then the card description verbatim (the description does NOT carry the title — it begins at the `**In one sentence:**` line — so reconstruct that first line from the card's title field). Strip the `## Pipeline` block from the body, anchored to STANDALONE marker lines: take the LAST line whose entire content is exactly `<!-- vk:pipeline:start -->`, and the first line after it whose entire content is exactly `<!-- vk:pipeline:end -->`, and delete everything between them including both marker lines. A marker mentioned inside a prose line is not a delimiter — leave that line alone, since a spec may legitimately quote the markers while describing them. Then collapse the blank run the strip leaves behind so the file ends with a single trailing newline. Also sweep out any stray executor-pin bullet (a line matching `- Run this card with the ... execution agent: pass ...`) left outside the block — it normally sits inside the block and goes with it, so this is just a safety net. Do not edit, re-author, or re-verify the copied text: adopt the card's decisions as settled. Then report \"spec adopted from card description\". (The card description is already in your task context; if you were given only the card title/id, `get_issue` the card to fetch it.) OTHERWISE: Write a technical spec for this card and save it to `SPEC.md` at the workspace root (one level above the repo, next to `CLAUDE.md` — never inside the repo) before implementing."

[[stage]]
id = "recall-knowledge"
label = "Recall prior knowledge"
default_enabled = true
prompt = "Before planning, recall what this project already knows: search the project knowledge base for pages relevant to this card and distill the matches into a `PRIOR_KNOWLEDGE.md` at the workspace root for the spec and plan stages to build on. Read-only on the knowledge base; if it is empty (first card), note that and continue."

[[stage]]
id = "plan"
label = "Create plan"
default_enabled = true
prompt = "Write a step-by-step implementation plan and save it to `IMPLEMENTATION_PLAN.md` at the workspace root (one level above the repo, next to `CLAUDE.md` — never inside the repo)."

[[stage]]
id = "plan-review"
label = "Review plan"
default_enabled = false
prompt = "Have the implementation plan reviewed (e.g. a codex plan review, read-only) and resolve blockers before writing code."

[[stage]]
id = "wait-for-approval"
label = "Wait for approval"
default_enabled = false
prompt = "Pause for operator approval at this point: commit the work so far, then stop and wait for the operator's decision or instructions before continuing to later stages — do not advance on your own until the operator responds."

[[stage]]
id = "code-review"
label = "Review via Codex"
default_enabled = true
prompt = "After implementing, run an independent Codex review of the card's diff (the `codex-review` skill / Codex CLI), iterating until it reports no significant findings. Address confirmed findings and re-verify before marking the card ready."

[[stage]]
id = "update-docs"
label = "Update documentation"
default_enabled = false
prompt = "Update the documentation affected by this change so the docs match what shipped, and commit it before marking the card ready."

[[stage]]
id = "enrich-knowledge"
label = "Enrich knowledge base"
default_enabled = true
prompt = "Once the change is implemented (and reviewed/documented, if those stages ran), distill any reusable knowledge from what shipped into the project knowledge base: add or update topic pages, tag each with this card's id, refresh the index, and commit the knowledge base before marking the card ready. If nothing reusable emerged, say so (\"no new knowledge to record\") rather than writing filler."

[[stage]]
id = "review-manual"
label = "Manual review (alarm)"
default_enabled = false
prompt = "MANUAL REVIEW: stop here and hand the work to the operator. Commit all work-in-progress first (staged, with a descriptive message) so nothing is lost, leave the tree otherwise clean, then emit a line exactly like `VK-REVIEW-REQUEST: <one-line summary of what to review and where>` and STOP — this triggers an alarm so the operator reviews the result. Do NOT advance to any later stage, do NOT merge, and do NOT open a PR until the operator responds with explicit instructions."
[[stage]]
id = "merge"
label = "Merge to base"
default_enabled = false
prompt = "When the work is implemented and reviewed, squash-merge this card's branch into the base branch yourself — this stage being listed is your authorization, so do not wait for a go-ahead; gating, when wanted, is the Wait-for-approval stage's job."

[[stage]]
id = "pr"
label = "Open pull request"
default_enabled = false
prompt = "When the work is implemented and reviewed, open a pull request for this card against the base branch."
