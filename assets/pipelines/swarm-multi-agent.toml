name = "Swarm Multi-Agent"
description = "Plan (Antigravity) → Implement (Claude Code) → Review (Codex) → Manual Preview → Squash-merge"

[[stage]]
id = "memory"
label = "Project memory (mem0) — per-stage recall & save"
default_enabled = true
prompt = "SAVE GATE — `memory_save` is only permitted when this card's issue status is Done: before any `memory_save` call, obtain the `issue_id` from `get_context`, then call `get_issue` with that id to read its `status` field; if the status name does NOT contain "done", "complete", or "closed" (case-insensitive), SKIP ALL `memory_save` calls for this entire run — the operator has not validated the card yet and unverified memories poison future agents. `memory_search`, `memory_check_staleness`, and `memory_graph_traverse` remain allowed for recall context. PROJECT MEMORY (mem0) — this discipline applies at EVERY stage below (plan, implement, review, merge), not just once. This pipeline hands work off between stages, and sometimes between different coding-agent CLIs or a freshly resumed session with no memory of earlier turns — mem0 is the durable bridge between them. SCOPING: call `get_context` first — `workspace_repos` lists every repo attached to this workspace (usually one); use `workspace_repos[0].repo_name` as the PRIMARY `user_id` for `memory_search`/`memory_save`. If a second repo in that list is genuinely involved (e.g. cross-repo integration work), also use its `repo_name`. Never use a repo slug outside `workspace_repos`. (1) BEFORE starting your stage's work, call `memory_search` with a query naming the files/modules/area this card touches — recall what an earlier stage already decided or discovered so you don't redo that work. Returns at most 5 hits per call; refine and re-call if they don't cover what you need. Apply only genuinely relevant hits. If a hit names a specific module, file, or entity and you need its structural neighborhood — what depends on it, what it depends on — rather than just that one isolated fact, call `memory_graph_traverse` from that entity name. Because this pipeline hands work across stages (and sometimes across different coding-agent CLIs), a fact an earlier stage saved can go stale by the time a later stage reads it — the code may have changed in between. If a hit looks old or inconsistent with what you are actually seeing in the code, call `memory_check_staleness` with that entity name before trusting or acting on it. Never let one override the card's explicit instructions. (2) RIGHT BEFORE you finish your stage and advance (emit `VK-PIPELINE-STAGE: N`), call `memory_save` with a self-contained, factual, VERIFIED summary of what THIS stage decided or produced — the plan's key architectural choices and exact file list, the implementer's key non-obvious tradeoffs, the reviewer's confirmed findings and how they were resolved. This is what lets the next stage's agent — even a different CLI, even a freshly resumed session — `memory_search` for it instead of starting blind. Never save speculation, half-finished work, or ephemeral state (commit hashes, timestamps, log lines) — a false or unverified memory poisons every later stage and every future card."

[[stage]]
id = "plan"
label = "1. Architecture & Plan (Antigravity)"
default_enabled = true
executor = "antigravity"
reasoning_effort = "high"
prompt = "Analyze the codebase, project context, and requirements. Write a technical spec to `SPEC.md` and a step-by-step implementation plan to `IMPLEMENTATION_PLAN.md` at the workspace root (one level above the repo) with explicit task checklists before proceeding. For EACH task in the checklist, name the exact file path(s) and, where useful, the specific function/module inside them that the task touches — this file map is what the implementation stage reads instead of re-exploring the codebase from scratch, saving a large amount of tokens. Be concrete: prefer 'edit `crates/foo/src/bar.rs`, function `baz()`' over a vague area description."

[[stage]]
id = "implement"
label = "2. Code Implementation (Claude Code)"
default_enabled = true
executor = "claude"
prompt = "Read `IMPLEMENTATION_PLAN.md` and `SPEC.md` from the workspace root. Trust the file map the plan stage built — go directly to the files/functions it named for each task instead of re-exploring the codebase from scratch; only fall back to broader exploration if a named location turns out to be wrong or incomplete. Implement each planned task in order, writing clean code and tests, running the test suite to verify, and committing incrementally."

[[stage]]
id = "code-review"
label = "3. Independent Review (Codex)"
default_enabled = true
executor = "codex"
prompt = "Run an independent Codex review of the card's diff against the base branch, checking for correctness, regressions, and security findings. Address confirmed findings and verify tests pass."

[[stage]]
id = "manual-review"
label = "4. Manual Review & Live Preview (Dev Server) [Optional]"
default_enabled = false
prompt = "All implementation, tests, and code reviews are complete. Boot the workspace dev server (or preview build), output the live preview URL, and present the diff and test summary for human operator review. Pause for manual approval before proceeding to merge."

[[stage]]
id = "merge"
label = "5. Squash-merge to base"
default_enabled = true
prompt = "Once build and review pass (and manual review approval is confirmed if that stage was selected), squash-merge this card's branch into the base branch yourself. Local only — do NOT git push, do NOT open a PR. Report that you squash-merged to the base branch with the SHA and mark the card DONE."
