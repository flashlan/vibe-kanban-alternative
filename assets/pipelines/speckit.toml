name = "SpecKit"
description = "Spec-Driven Development flow: run the /speckit.* slash commands in order, writing artifacts under specs/<branch>/."

[[stage]]
id = "orchestrate"
label = "Orchestrate (auto-drive)"
default_enabled = false
prompt = "Have the orchestrator agent pick this card up and drive it to done autonomously, running the card's pipeline stages in order — regardless of which board column the card is in (it may be started even from Todo)."

[[stage]]
id = "memory"
label = "Project memory (mem0)"
default_enabled = true
prompt = "General project rules: call `get_rules` before starting this card and keep its `pre` guidance in mind throughout; run through `post` as a closing checklist before finishing."

[[stage]]
id = "speckit-constitution"
label = "SpecKit: Constitution"
default_enabled = true
prompt = "SpecKit: establish or refresh the project constitution at `.specify/memory/constitution.md` (run `/speckit.constitution`) before specifying."

[[stage]]
id = "speckit-specify"
label = "SpecKit: Specify"
default_enabled = true
prompt = "SpecKit: write the feature specification to `specs/<current branch>/spec.md` (run `/speckit.specify`), focusing on what and why."

[[stage]]
id = "speckit-clarify"
label = "SpecKit: Clarify"
default_enabled = true
prompt = "SpecKit: resolve the spec's open questions (run `/speckit.clarify`) before planning."

[[stage]]
id = "speckit-plan"
label = "SpecKit: Plan"
default_enabled = true
prompt = "SpecKit: write the technical plan to `specs/<current branch>/plan.md` plus research/data-model/contracts as needed (run `/speckit.plan`)."

[[stage]]
id = "speckit-tasks"
label = "SpecKit: Tasks"
default_enabled = true
prompt = "SpecKit: break the plan into a dependency-ordered, parallel-aware `specs/<current branch>/tasks.md` (run `/speckit.tasks`)."

[[stage]]
id = "speckit-analyze"
label = "SpecKit: Analyze"
default_enabled = true
prompt = "SpecKit: cross-check spec, plan, and tasks for gaps and constitution violations (run `/speckit.analyze`) before implementing."

[[stage]]
id = "speckit-implement"
label = "SpecKit: Implement"
default_enabled = true
prompt = "SpecKit: execute `specs/<current branch>/tasks.md` in dependency order, doing `[P]` tasks within a layer together and ticking each task off as it lands (run `/speckit.implement`)."

[[stage]]
id = "code-review"
label = "Review via Codex"
default_enabled = false
prompt = "After implementing, run an independent Codex review of the card's diff (the `codex-review` skill / Codex CLI), iterating until it reports no significant findings. Address confirmed findings and re-verify before marking the card ready."

[[stage]]
id = "review-manual"
label = "Manual review (alarm)"
default_enabled = false
prompt = "MANUAL REVIEW: stop here and hand the work to the operator. Commit all work-in-progress first (staged, with a descriptive message) so nothing is lost, leave the tree otherwise clean, then emit a line exactly like `VK-REVIEW-REQUEST: <one-line summary of what to review and where>` and STOP — this triggers an alarm so the operator reviews the result. Do NOT advance to any later stage, do NOT merge, and do NOT open a PR until the operator responds with explicit instructions."
[[stage]]
id = "merge"
label = "Integration Guard → Done"
default_enabled = false
prompt = "When the work is implemented and reviewed, call `complete_workspace_card` through the normal card workflow. The Integration Guard records the task's original target HEAD and performs a three-way integration, so independent target changes do not require a rebase. If semantic or Git overlap is reported, leave the card open and report the conflict for review. Do not manually rebase, update refs, push, or open a PR."
