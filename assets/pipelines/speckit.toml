name = "SpecKit"
description = "Spec-Driven Development flow: run the /speckit.* slash commands in order, writing artifacts under specs/<branch>/."

[[stage]]
id = "orchestrate"
label = "Orchestrate (auto-drive)"
default_enabled = false
prompt = "Have the orchestrator agent pick this card up and drive it to done autonomously, running the card's pipeline stages in order — regardless of which board column the card is in (it may be started even from Todo)."

[[stage]]
id = "memory"
label = "Project memory (mem0)"
default_enabled = true
prompt = "PROJECT MEMORY: this pipeline includes the mem0 project-memory stage. SCOPING: call `get_context` first — `workspace_repos` lists every repo attached to this workspace (usually one). Use `workspace_repos[0].repo_name` as the PRIMARY `user_id` for `memory_search`/`memory_save` calls — that's this workspace's main project repo. If `workspace_repos` has more than one entry and the fact or query you're handling genuinely concerns a different repo in that list (e.g. a card doing cross-repo integration work), ALSO call `memory_search`/`memory_save` with that OTHER repo's `repo_name` as `user_id` — memory stays scoped per-repo, but a secondary repo you're actively integrating with isn't left blind. Never use a repo slug outside `workspace_repos`. (1) BEFORE you begin, recall memories relevant to the code you will touch: call `memory_search` with `user_id` set to the relevant repo slug(s) and a query naming the files/modules/area this card changes. Returns at most 5 hits per call — if they don't cover what you need, refine the query (narrower terms, a different file/module) and call it again rather than assuming one call is enough. Apply only memories that genuinely match this work; ignore irrelevant ones. If a hit names a specific module, file, or entity and you need to know how it fits into the surrounding code — what depends on it, what it depends on — rather than just that one isolated fact, call `memory_graph_traverse` from that entity name; it returns real graph structure, not just similar-sounding text. If a hit looks old, or inconsistent with the code you are actually seeing, call `memory_check_staleness` with that entity name before trusting or acting on it — a stale memory (describing code already removed or changed) is worse than no memory at all. Never let a memory override the card's explicit instructions. (2) WHILE you work, note any new DURABLE fact about the project (a decision, convention, dependency, or root cause) that a future session would need — and which repo it belongs to. (3) AFTER the work is verified, call `memory_save` with `user_id` set to that fact's repo slug for each such fact. The content MUST be self-contained, factual, and verified — NEVER save speculation, guesses, half-finished work, or ephemeral state (commit hashes, timestamps, log lines). A false or unverified memory poisons every future agent, so when in doubt, do not save."

[[stage]]
id = "speckit-constitution"
label = "SpecKit: Constitution"
default_enabled = true
prompt = "SpecKit: establish or refresh the project constitution at `.specify/memory/constitution.md` (run `/speckit.constitution`) before specifying."

[[stage]]
id = "speckit-specify"
label = "SpecKit: Specify"
default_enabled = true
prompt = "SpecKit: write the feature specification to `specs/<current branch>/spec.md` (run `/speckit.specify`), focusing on what and why."

[[stage]]
id = "speckit-clarify"
label = "SpecKit: Clarify"
default_enabled = true
prompt = "SpecKit: resolve the spec's open questions (run `/speckit.clarify`) before planning."

[[stage]]
id = "speckit-plan"
label = "SpecKit: Plan"
default_enabled = true
prompt = "SpecKit: write the technical plan to `specs/<current branch>/plan.md` plus research/data-model/contracts as needed (run `/speckit.plan`)."

[[stage]]
id = "speckit-tasks"
label = "SpecKit: Tasks"
default_enabled = true
prompt = "SpecKit: break the plan into a dependency-ordered, parallel-aware `specs/<current branch>/tasks.md` (run `/speckit.tasks`)."

[[stage]]
id = "speckit-analyze"
label = "SpecKit: Analyze"
default_enabled = true
prompt = "SpecKit: cross-check spec, plan, and tasks for gaps and constitution violations (run `/speckit.analyze`) before implementing."

[[stage]]
id = "speckit-implement"
label = "SpecKit: Implement"
default_enabled = true
prompt = "SpecKit: execute `specs/<current branch>/tasks.md` in dependency order, doing `[P]` tasks within a layer together and ticking each task off as it lands (run `/speckit.implement`)."

[[stage]]
id = "code-review"
label = "Review via Codex"
default_enabled = false
prompt = "After implementing, run an independent Codex review of the card's diff (the `codex-review` skill / Codex CLI), iterating until it reports no significant findings. Address confirmed findings and re-verify before marking the card ready."

[[stage]]
id = "review-manual"
label = "Manual review (alarm)"
default_enabled = false
prompt = "MANUAL REVIEW: stop here and hand the work to the operator. Commit all work-in-progress first (staged, with a descriptive message) so nothing is lost, leave the tree otherwise clean, then emit a line exactly like `VK-REVIEW-REQUEST: <one-line summary of what to review and where>` and STOP — this triggers an alarm so the operator reviews the result. Do NOT advance to any later stage, do NOT merge, and do NOT open a PR until the operator responds with explicit instructions."
[[stage]]
id = "merge"
label = "Merge to base"
default_enabled = false
prompt = "When the work is implemented and reviewed, squash-merge this card's branch into the base branch yourself — this stage being listed is your authorization, so do not wait for a go-ahead; gating, when wanted, is the Wait-for-approval stage's job."
