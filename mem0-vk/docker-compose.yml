services:
  vibe-kanban:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: vibe-kanban
    restart: unless-stopped
    ports:
      - "3001:3001"
      - "3002:3002"
      - "3003:3003"
    volumes:
      - ~/projects:/repos
      - ~/.ssh:/home/appuser/.ssh:ro
      - ~/.gitconfig:/home/appuser/.gitconfig:ro
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - MEM0_URL=http://mem0:8000
    depends_on:
      - mem0

  qdrant:
    image: qdrant/qdrant:latest
    container_name: mem0-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  mem0:
    build: .
    container_name: mem0-vk
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
    environment:
      - QDRANT_URL=http://qdrant:6333
    env_file:
      - .env
    volumes:
      - mem0-data:/app/data

volumes:
  qdrant-data:
  mem0-data:
